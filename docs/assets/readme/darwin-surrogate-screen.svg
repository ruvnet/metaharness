<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-labelledby="t d"><title id="t">Surrogate pre-screening of one candidate pool</title><desc id="d">Twelve mutation candidates are proposed for one parent. The surrogate predicts a score for each. Three are sent to the external evaluator: one explore slot kept regardless of prediction, and the two with the highest predicted score. The other nine are never evaluated.</desc><style>.bg{fill:#0f172a}.t{fill:#e2e8f0;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
.l{fill:#f8fafc;font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{fill:#94a3b8;font:11px system-ui,-apple-system,'Segoe UI',sans-serif}
.b{fill:#1e293b;stroke:#334155;stroke-width:1.5}
.a{stroke:#475569;stroke-width:2;fill:none}.ah{fill:#475569}
.c{fill:#64748b}
.bar{fill:#38bdf8;transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow 9s infinite}
.fade{animation:fade 9s infinite}
.ring{fill:none;stroke-width:2.5;opacity:0;animation:pick 9s infinite}
.rp{stroke:#22c55e}.re{stroke:#f59e0b}
.tag{opacity:0;animation:pick 9s infinite;font:600 10px system-ui,-apple-system,'Segoe UI',sans-serif}
.tp{fill:#22c55e}.te{fill:#f59e0b}
.ph{fill:#e2e8f0;font:600 12px system-ui,-apple-system,'Segoe UI',sans-serif;opacity:0}
.p1{animation:ph1 9s infinite}.p2{animation:ph2 9s infinite}.p3{animation:ph3 9s infinite}
@keyframes grow{0%,12%{transform:scaleY(0)}32%,100%{transform:scaleY(1)}}
@keyframes fade{0%,45%{opacity:1}58%,94%{opacity:.18}100%{opacity:1}}
@keyframes pick{0%,45%{opacity:0}55%,94%{opacity:1}100%{opacity:0}}
@keyframes ph1{0%,2%{opacity:0}5%,28%{opacity:1}32%,100%{opacity:0}}
@keyframes ph2{0%,32%{opacity:0}35%,45%{opacity:1}49%,100%{opacity:0}}
@keyframes ph3{0%,49%{opacity:0}53%,94%{opacity:1}98%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bar,.fade,.ring,.tag,.p1,.p2,.p3{animation:none}.bar{transform:none}.ring,.tag{opacity:1}.p3{opacity:1}}</style><rect class="bg" width="760" height="312" rx="14"/><text class="t" x="20" y="38">One parent, one generation: 12 proposed, 3 evaluated</text><text class="ph p1" x="20" y="62">1 · propose oversample × childrenPerGeneration mutations, then predict each with the surrogate</text><text class="ph p2" x="20" y="62">2 · rank the pool by predicted score</text><text class="ph p3" x="20" y="62">3 · evaluate one explore slot plus the best-predicted — same evaluator budget as before</text><path class="a" d="M30 226H702"/><g><rect class="bar" x="47" y="176" width="22" height="50" rx="3"/><circle class="c" cx="58" cy="246" r="7"/><text class="s" x="58" y="270" text-anchor="middle">own</text></g><circle class="ring re" cx="58" cy="246" r="12"/><text class="tag te" x="58" y="168" text-anchor="middle">explore</text><g class="fade"><rect class="bar" x="103" y="160" width="22" height="66" rx="3"/><circle class="c" cx="114" cy="246" r="7"/><text class="s" x="114" y="270" text-anchor="middle">own</text></g><g class="fade"><rect class="bar" x="159" y="189" width="22" height="37" rx="3"/><circle class="c" cx="170" cy="246" r="7"/><text class="s" x="170" y="270" text-anchor="middle">own</text></g><g class="fade"><rect class="bar" x="215" y="132" width="22" height="94" rx="3"/><circle class="c" cx="226" cy="246" r="7"/><text class="s" x="226" y="270" text-anchor="middle">extra</text></g><g class="fade"><rect class="bar" x="271" y="200" width="22" height="26" rx="3"/><circle class="c" cx="282" cy="246" r="7"/><text class="s" x="282" y="270" text-anchor="middle">extra</text></g><g><rect class="bar" x="327" y="117" width="22" height="109" rx="3"/><circle class="c" cx="338" cy="246" r="7"/><text class="s" x="338" y="270" text-anchor="middle">extra</text></g><circle class="ring rp" cx="338" cy="246" r="12"/><text class="tag tp" x="338" y="109" text-anchor="middle">predicted</text><g class="fade"><rect class="bar" x="383" y="170" width="22" height="56" rx="3"/><circle class="c" cx="394" cy="246" r="7"/><text class="s" x="394" y="270" text-anchor="middle">extra</text></g><g class="fade"><rect class="bar" x="439" y="183" width="22" height="43" rx="3"/><circle class="c" cx="450" cy="246" r="7"/><text class="s" x="450" y="270" text-anchor="middle">extra</text></g><g class="fade"><rect class="bar" x="495" y="147" width="22" height="79" rx="3"/><circle class="c" cx="506" cy="246" r="7"/><text class="s" x="506" y="270" text-anchor="middle">extra</text></g><g><rect class="bar" x="551" y="125" width="22" height="101" rx="3"/><circle class="c" cx="562" cy="246" r="7"/><text class="s" x="562" y="270" text-anchor="middle">extra</text></g><circle class="ring rp" cx="562" cy="246" r="12"/><text class="tag tp" x="562" y="117" text-anchor="middle">predicted</text><g class="fade"><rect class="bar" x="607" y="204" width="22" height="22" rx="3"/><circle class="c" cx="618" cy="246" r="7"/><text class="s" x="618" y="270" text-anchor="middle">extra</text></g><g class="fade"><rect class="bar" x="663" y="155" width="22" height="71" rx="3"/><circle class="c" cx="674" cy="246" r="7"/><text class="s" x="674" y="270" text-anchor="middle">extra</text></g><text class="s" x="30" y="292">own = the candidates the unscreened loop would have evaluated · extra = additional proposals only the surrogate sees</text></svg>
