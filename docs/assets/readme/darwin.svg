<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-labelledby="t d"><title id="t">@metaharness/darwin — freeze the model, evolve the harness</title><desc id="d">parent (harness policy) → mutate (children) → sandbox (run each child) → oracle (deterministic check) → promote (only if it beats parent)</desc><style>
.bg{fill:#0f172a}.t{fill:#e2e8f0;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
.l{fill:#f8fafc;font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{fill:#94a3b8;font:11px system-ui,-apple-system,'Segoe UI',sans-serif}
.b{fill:#1e293b;stroke:#334155;stroke-width:1.5}
.h{fill:none;stroke:#38bdf8;stroke-width:2.5;opacity:0;animation:hl 7.5s infinite}
.a{stroke:#475569;stroke-width:2;fill:none}.ah{fill:#475569}
.dot{fill:#38bdf8;animation:mv 7.5s infinite linear}
@keyframes hl{0%{opacity:0}4%{opacity:1}20.0%{opacity:1}24.0%{opacity:0}100%{opacity:0}}
@keyframes mv{0.0%{transform:translate(82px,168px)}20.0%{transform:translate(231px,168px)}40.0%{transform:translate(380px,168px)}60.0%{transform:translate(529px,168px)}80.0%{transform:translate(678px,168px)}100%{transform:translate(678px,168px)}}
@media (prefers-reduced-motion:reduce){.h,.dot{animation:none}.h{opacity:.35}}</style><rect class="bg" width="760" height="210" rx="14"/><text class="t" x="20" y="38">@metaharness/darwin — freeze the model, evolve the harness</text><rect class="b" x="20" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:0.00s" x="20" y="82" width="124" height="64" rx="10"/><text class="l" x="82" y="109" text-anchor="middle">parent</text><text class="s" x="82" y="129" text-anchor="middle">harness policy</text><path class="a" d="M148 114H157"/><path class="ah" d="M163 114l-8 -5v10z"/><rect class="b" x="169" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:1.50s" x="169" y="82" width="124" height="64" rx="10"/><text class="l" x="231" y="109" text-anchor="middle">mutate</text><text class="s" x="231" y="129" text-anchor="middle">children</text><path class="a" d="M297 114H306"/><path class="ah" d="M312 114l-8 -5v10z"/><rect class="b" x="318" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:3.00s" x="318" y="82" width="124" height="64" rx="10"/><text class="l" x="380" y="109" text-anchor="middle">sandbox</text><text class="s" x="380" y="129" text-anchor="middle">run each child</text><path class="a" d="M446 114H455"/><path class="ah" d="M461 114l-8 -5v10z"/><rect class="b" x="467" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:4.50s" x="467" y="82" width="124" height="64" rx="10"/><text class="l" x="529" y="109" text-anchor="middle">oracle</text><text class="s" x="529" y="129" text-anchor="middle">deterministic check</text><path class="a" d="M595 114H604"/><path class="ah" d="M610 114l-8 -5v10z"/><rect class="b" x="616" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:6.00s" x="616" y="82" width="124" height="64" rx="10"/><text class="l" x="678" y="109" text-anchor="middle">promote</text><text class="s" x="678" y="129" text-anchor="middle">only if it beats parent</text><path class="a" stroke-dasharray="5 5" d="M678 152v28H82v-22"/><path class="ah" d="M82 150l-5 8h10z"/><circle class="dot" r="5" cx="0" cy="0"/></svg>
