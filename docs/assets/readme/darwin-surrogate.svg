<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d"><title id="t">evolveNumeric with a ruv-fann surrogate</title><desc id="d">Each generation: scored genomes from the archive train a small ruv-fann network; four times as many candidates are proposed; the network ranks them; only the top picks go to the external evaluator; their real scores return to the archive.</desc><style>.bg{fill:#0f172a}.t{fill:#e2e8f0;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
.l{fill:#f8fafc;font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{fill:#94a3b8;font:11px system-ui,-apple-system,'Segoe UI',sans-serif}
.b{fill:#1e293b;stroke:#334155;stroke-width:1.5}
.a{stroke:#475569;stroke-width:2;fill:none}.ah{fill:#475569}
.h{fill:none;stroke:#38bdf8;stroke-width:2.5;opacity:0;animation:hl 10s infinite}
.ev{stroke:#f59e0b}
.dot{fill:#38bdf8;animation:mv 10s infinite linear}
.back{stroke:#38bdf8;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.2s infinite linear;opacity:.7}
@keyframes hl{0%{opacity:0}3%{opacity:1}15%{opacity:1}18%{opacity:0}100%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes mv{0%{transform:translate(82px,168px)}16%{transform:translate(231px,168px)}32%{transform:translate(380px,168px)}48%{transform:translate(529px,168px)}64%{transform:translate(678px,168px)}80%{transform:translate(678px,168px)}84%{transform:translate(678px,198px)}96%{transform:translate(82px,198px)}100%{transform:translate(82px,168px)}}
@media (prefers-reduced-motion:reduce){.h,.dot,.back{animation:none}.h{opacity:.35}}</style><rect class="bg" width="760" height="250" rx="14"/><text class="t" x="20" y="38">evolveNumeric + ruv-fann surrogate — rank many, evaluate few</text><text class="s" x="20" y="58">The surrogate only orders candidates. Every score still comes from your external evaluator.</text><rect class="b" x="20" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:0.00s" x="20" y="82" width="124" height="64" rx="10"/><text class="l" x="82" y="110" text-anchor="middle">archive</text><text class="s" x="82" y="129" text-anchor="middle">scored genomes</text><path class="a" d="M147 114h15"/><path class="ah" d="M162 109l8 5l-8 5z"/><rect class="b" x="169" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:1.60s" x="169" y="82" width="124" height="64" rx="10"/><text class="l" x="231" y="110" text-anchor="middle">fit</text><text class="s" x="231" y="129" text-anchor="middle">ruv-fann, WASM</text><path class="a" d="M296 114h15"/><path class="ah" d="M311 109l8 5l-8 5z"/><rect class="b" x="318" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:3.20s" x="318" y="82" width="124" height="64" rx="10"/><text class="l" x="380" y="110" text-anchor="middle">propose</text><text class="s" x="380" y="129" text-anchor="middle">4× candidates</text><path class="a" d="M445 114h15"/><path class="ah" d="M460 109l8 5l-8 5z"/><rect class="b" x="467" y="82" width="124" height="64" rx="10"/><rect class="h" style="animation-delay:4.80s" x="467" y="82" width="124" height="64" rx="10"/><text class="l" x="529" y="110" text-anchor="middle">rank</text><text class="s" x="529" y="129" text-anchor="middle">predicted score</text><path class="a" d="M594 114h15"/><path class="ah" d="M609 109l8 5l-8 5z"/><rect class="b" x="616" y="82" width="124" height="64" rx="10"/><rect class="h ev" style="animation-delay:6.40s" x="616" y="82" width="124" height="64" rx="10"/><text class="l" x="678" y="110" text-anchor="middle">evaluate</text><text class="s" x="678" y="129" text-anchor="middle">top picks only</text><path class="back" d="M678 154V198H82V154"/><path class="ah" style="fill:#38bdf8" d="M77 158l5 -8l5 8z"/><text class="s" x="380" y="218" text-anchor="middle">evaluator scores join the archive and retrain the surrogate next generation</text><circle class="dot" r="6"/></svg>
