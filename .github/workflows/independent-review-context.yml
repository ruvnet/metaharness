name: Independent Review Context

on:
  pull_request:
    paths:
      - 'packages/flywheel/src/review-context.ts'
      - 'packages/flywheel/src/index.ts'
      - 'packages/flywheel/__tests__/review-context.test.ts'
      - 'scripts/benchmark-independent-review-context.mjs'
      - 'docs/adrs/ADR-317-independent-review-context-isolation.md'
      - '.github/workflows/independent-review-context.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: '10.9.8'

jobs:
  review-context:
    name: Node ${{ matrix.node }} / npm 10.9.8
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '24.19.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned like ci.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned like ci.yml
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm --version
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @metaharness/flywheel
      - run: npm test --workspace @metaharness/flywheel -- --run review-context.test.ts
      - run: node scripts/benchmark-independent-review-context.mjs
