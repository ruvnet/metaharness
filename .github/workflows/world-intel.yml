name: World Intel TS + WASM
on:
  pull_request:
    paths: ['packages/world-intel/**', 'packages/harness/**', '.github/workflows/world-intel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --workspaces=false --ignore-scripts
        working-directory: packages/world-intel
      - run: npm run build:wasm && git diff --exit-code -- wasm/geo.wasm
        working-directory: packages/world-intel
      - run: npm run build && npm run lint && npm test && npm run audit:parity
        working-directory: packages/world-intel
