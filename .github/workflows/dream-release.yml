name: Release
# Per-package npm release with provenance. Tag a merged main commit with
#   <package>-vX.Y.Z   e.g. metaharness-v0.4.21, darwin-v0.13.1, sdk-v0.1.2
# where <package> is a packages/<dir> name, an npm name, or an @metaharness/<name>
# short name. Only that package is packed, smoke-tested, published and verified.
# dream-vX.Y.Z keeps the original four-package Dream set (sdk, flywheel, agntcy,
# metaharness) and checks the version against metaharness.
on:
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag on main: <package>-vX.Y.Z (or dream-vX.Y.Z)'
        required: true
        type: string
      accept_merged_pr_ci:
        description: 'If the push-event CI run on the tag SHA is not green (e.g. stuck in the runner queue), accept CI from the merged PR head instead. Only allowed when that head has the identical tree and every check on it passed. Security must still pass on the tag SHA.'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tagged package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^([a-z0-9][a-z0-9._-]*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::tag must be <package>-vX.Y.Z"; exit 1; }
          prefix="${BASH_REMATCH[1]}" version="${BASH_REMATCH[2]}"
          if [[ "$prefix" == dream ]]; then
            dirs="sdk flywheel agntcy create-agent-harness" primary=create-agent-harness
          else
            primary="$(PREFIX="$prefix" node --input-type=module -e "
              import { readdirSync, readFileSync, existsSync } from 'node:fs';
              const p = process.env.PREFIX;
              const hits = readdirSync('packages').filter(d => existsSync('packages/'+d+'/package.json')).filter(d => {
                const n = JSON.parse(readFileSync('packages/'+d+'/package.json', 'utf8')).name;
                return d === p || n === p || n === '@metaharness/' + p;
              });
              if (hits.length !== 1) throw new Error('tag prefix ' + p + ' matches ' + hits.length + ' packages');
              console.log(hits[0]);")"
            dirs="$primary"
          fi
          PRIMARY="$primary" VERSION="$version" node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const p = JSON.parse(readFileSync('packages/' + process.env.PRIMARY + '/package.json', 'utf8'));
            if (p.private) throw new Error(p.name + ' is private');
            if (p.version !== process.env.VERSION) throw new Error('tag/package version mismatch: ' + p.name + '@' + p.version);"
          test -f "docs/releases/$RELEASE_TAG.md" || { echo "::error::missing docs/releases/$RELEASE_TAG.md"; exit 1; }
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "wasm=$(RELEASE_PACKAGES="$dirs" node scripts/wasm-artifacts.mjs needs-wasm)" >> "$GITHUB_OUTPUT"
          echo "dream=$([[ "$prefix" == dream ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$prefix" == dream ]]; then title="MetaHarness $version — Dream integration and security fixes"
          else title="$(node -p "require('./packages/$primary/package.json').name")@$version"; fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Verify merged source and exact-SHA CI
        shell: bash
        env:
          ACCEPT_MERGED_PR_CI: ${{ inputs.accept_merged_pr_ci || false }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          sha="$(git rev-parse HEAD)"
          run_ok() { test "$(gh run list --workflow "$1" --commit "$2" --event "$3" --limit 1 --json conclusion --jq '.[0].conclusion')" = success; }
          run_ok security.yml "$sha" push
          if ! run_ok ci.yml "$sha" push; then
            test "$ACCEPT_MERGED_PR_CI" = true || { echo "::error::CI on $sha is not green"; exit 1; }
            # Fallback: the squash-merged PR's head must carry the identical tree and fully green checks.
            pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '[.[]|select(.merged_at!=null)][0].number')"
            head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
            git fetch --no-tags origin "pull/$pr/head"
            test "$(git rev-parse "$head^{tree}")" = "$(git rev-parse "$sha^{tree}")" || { echo "::error::PR #$pr head tree differs from $sha"; exit 1; }
            run_ok ci.yml "$head" pull_request
            bad="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" --jq '[.check_runs[]|select(.conclusion!="success" and .conclusion!="skipped" and .conclusion!="neutral")]|length')"
            test "$bad" = 0 || { echo "::error::PR #$pr head has $bad non-green checks"; exit 1; }
            echo "::notice::push CI on $sha not green; accepted identical-tree PR #$pr head $head (all checks green)"
          fi
          test "$(gh issue list --label release-blocker --state open --json number --jq length)" = 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Packages that declare metaharness.wasmArtifacts ship gitignored wasm, so it has to be
      # built here; without this step @metaharness/horizon 0.2.1 was published with no wasm.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: steps.pkg.outputs.wasm == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        if: steps.pkg.outputs.wasm == 'true'
        with:
          shared-key: release-wasm
      - name: Install pinned wasm tools (crates.io only)
        if: steps.pkg.outputs.wasm == 'true'
        run: bash scripts/install-wasm-tools.sh
      - name: Build declared wasm artifacts
        if: steps.pkg.outputs.wasm == 'true'
        env:
          RELEASE_PACKAGES: ${{ steps.pkg.outputs.dirs }}
        run: node scripts/wasm-artifacts.mjs build
      - name: Build, test, audit, and seal packages
        env:
          RELEASE_PACKAGES: ${{ steps.pkg.outputs.dirs }}
        run: |
          npm ci --ignore-scripts
          npm run build
          npx vitest run --maxWorkers=2
          node --test packages/darwin-mode/bench/swebench/cost-guard.test.mjs
          npm audit --audit-level=moderate
          node scripts/dream-release.mjs pack
          node scripts/dream-release.mjs smoke
          if [ "${{ steps.pkg.outputs.dream }}" = true ]; then node bench/dream/canonicalization.mjs > dist-release/benchmark.json; fi
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5
        id: secrets
        with:
          secrets: |-
            npm_token:${{ vars.GCP_PROJECT_ID }}/NPM_TOKEN
      - name: Publish sealed npm artifacts with provenance and verify public bytes
        run: node scripts/dream-release.mjs publish
        env:
          RELEASE_PACKAGES: ${{ steps.pkg.outputs.dirs }}
          NODE_AUTH_TOKEN: ${{ steps.secrets.outputs.npm_token }}
      - name: Create GitHub release and verify downloaded artifacts
        shell: bash
        env:
          RELEASE_TITLE: ${{ steps.pkg.outputs.title }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file "docs/releases/$RELEASE_TAG.md" dist-release/*.tgz dist-release/*.json
          public="$RUNNER_TEMP/release-public"
          mkdir -p "$public"
          gh release download "$RELEASE_TAG" --dir "$public"
          for artifact in dist-release/*.tgz dist-release/dream-artifacts.json; do
            cmp "$artifact" "$public/$(basename "$artifact")"
          done
