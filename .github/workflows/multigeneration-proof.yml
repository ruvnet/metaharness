name: Multi-Generation Improvement Proof

on:
  pull_request:
    paths:
      - 'packages/flywheel/src/multigeneration-proof.ts'
      - 'packages/flywheel/src/index.ts'
      - 'packages/flywheel/__tests__/multigeneration-proof.test.ts'
      - 'scripts/benchmark-multigeneration-proof.mjs'
      - 'docs/adrs/ADR-318-multi-generation-improvement-proof.md'
      - '.github/workflows/multigeneration-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: '10.9.8'

jobs:
  multigen-proof:
    name: Node ${{ matrix.node }} / npm 10.9.8
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '24.19.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm --version
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @metaharness/flywheel
      - run: npm test --workspace @metaharness/flywheel -- --run multigeneration-proof.test.ts
      - run: node scripts/benchmark-multigeneration-proof.mjs
