name: Curriculum lab isolated contracts
on:
  pull_request:
    paths:
      - 'packages/curriculum-lab/**'
      - 'packages/darwin-mode/src/numeric-mutator.ts'
      - '.github/workflows/curriculum-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: No-install contract and real CPU learner checks
        working-directory: packages/curriculum-lab
        run: |
          npm test
          npm run lint
          npm run smoke
          npm pack --dry-run
