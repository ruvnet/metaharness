name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (semver)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

jobs:
  build-native:
    name: native ${{ matrix.target }}
    # The per-platform .node artifacts are not yet consumed by the publish job
    # (native publish is a TODO), so a flaky cross-compile target must not gate
    # the real npm publish. continue-on-error keeps the publish job's `needs`
    # satisfied; fail-fast=false lets every target attempt independently.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: kernel-linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: kernel-linux-arm64-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kernel-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kernel-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kernel-win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli@^3
      - name: Cross-compile setup (aarch64 linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: napi build
        working-directory: crates/kernel-napi
        run: napi build --platform --release --target ${{ matrix.target }}
      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: crates/kernel-napi/*.node

  build-wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      # GH #20 — build the NODEJS target, not `bundler`. The runtime loader (kernel-js loadWasm())
      # `import('../pkg/ruflo_kernel_wasm.js')` expects wasm-pack's --target nodejs (CommonJS shim that
      # auto-initialises the wasm on require, + pkg/package.json {"type":"commonjs"}). A `bundler`-target
      # artifact is ESM that needs a bundler + an explicit init() call, so loadWasm() cannot load it and
      # the kernel silently falls back to the JS floor — the exact #20 symptom. `npm run build:wasm` is
      # the single source of truth (correct target + the .gitignore/package.json fixups).
      - name: Build wasm (nodejs target — matches the runtime loader)
        working-directory: packages/kernel-js
        run: npm run build:wasm
      - name: Upload wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-wasm
          path: packages/kernel-js/pkg/

  gcp-auth-and-publish:
    name: Publish to npm (gated on GCP secret fetch)
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Bind release to the exact tag SHA
        id: release-sha
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag is not an explicit vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          head_sha="$(git rev-parse HEAD)"
          if [[ -z "$tag_sha" || "$tag_sha" != "$head_sha" ]]; then
            echo "::error::checked-out commit $head_sha does not equal tag $RELEASE_TAG commit $tag_sha"
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist-native
      - name: Download wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-wasm
          path: packages/kernel-js/pkg
      - name: GCP Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Install gcloud SDK
        # Required by scripts/validate-gcp-secrets.mjs (Gate 1 below).
        # The auth action sets ADC but doesn't install the CLI itself.
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Fetch NPM_TOKEN from GCP Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5
        with:
          secrets: |-
            npm_token:${{ env.GCP_PROJECT_ID }}/NPM_TOKEN
      - name: Smoke test before publish
        run: |
          npm ci || npm install
          npm run build
          npm run test
          node scripts/smoke.mjs

      - name: Pack the exact AVO release artifact
        id: avo-artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          package_file="$(npm pack --silent --workspace @metaharness/avo --pack-destination dist-release)"
          artifact_path="dist-release/$package_file"
          if [[ "$package_file" == *$'\n'* || ! -f "$artifact_path" ]]; then
            echo "::error::npm pack did not produce exactly one AVO tarball"
            exit 1
          fi
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────
      # PRE-PUBLISH GATES (iter 18 + 20)
      # ─────────────────────────────────────────────────────────────────
      - name: Gate 1 — GCP Secret Manager validation
        env:
          GCP_PROJECT: ${{ env.GCP_PROJECT_ID }}
          NPM_SECRET_NAME: NPM_TOKEN
          # iter 145: validate-gcp-secrets.mjs validates the npm token AND
          # any extra REQUIRED_SECRETS (comma-separated). The Pinata pin
          # below is OPTIONAL by design, so PINATA_JWT is NOT required here
          # by default. To make the IPFS marketplace pin a hard publish
          # prerequisite, set: REQUIRED_SECRETS: PINATA_JWT
          # REQUIRED_SECRETS: PINATA_JWT
        run: node scripts/validate-gcp-secrets.mjs

      - name: Gate 2 — exact-SHA AVO release claims
        env:
          AVO_RELEASE_SHA: ${{ steps.release-sha.outputs.sha }}
          AVO_RELEASE_TARBALL: ${{ steps.avo-artifact.outputs.path }}
          # Required for performance/frontier claims. This protected repository
          # or environment variable pins the complete authority/grader policy.
          AVO_CLAIM_TRUST_POLICY_HASH: ${{ vars.AVO_CLAIM_TRUST_POLICY_HASH }}
        run: node scripts/avo-claim-gate.mjs

      - name: Gate 3 — npm publish dry-run on every package
        run: node scripts/publish-dryrun.mjs

      # ─────────────────────────────────────────────────────────────────
      # ACTUAL PUBLISH — every non-private workspace package
      # ─────────────────────────────────────────────────────────────────
      - name: Publish @metaharness/kernel-* native packages
        env:
          NODE_AUTH_TOKEN: ${{ steps.secrets.outputs.npm_token }}
        run: |
          echo "TODO: publish per-platform native packages from dist-native/ (lands in a follow-up iteration)"

      - name: Publish workspace packages (idempotent — skips already-published versions)
        # One script instead of five sequential `npm publish` steps. The old
        # sequence had no skip-if-published logic, so a tag re-run 403'd on
        # the first package whose version was already live (usually
        # @metaharness/kernel) and never reached the later packages — the
        # reason all 7 tag/dispatch runs failed and releases went manual.
        # publish-workspace.mjs checks the registry per package and only
        # publishes versions that aren't there yet.
        env:
          NODE_AUTH_TOKEN: ${{ steps.secrets.outputs.npm_token }}
          # publish-workspace consumes the same tarball hashed by Gate 2.
          AVO_RELEASE_TARBALL: ${{ steps.avo-artifact.outputs.path }}
        run: node scripts/publish-workspace.mjs

      # ─────────────────────────────────────────────────────────────────
      # MARKETPLACE: pin the claude-marketplace registry entry to IPFS
      # ─────────────────────────────────────────────────────────────────
      - name: Generate marketplace registry entry
        # Reads .claude-plugin/plugin.json + root package.json + writes
        # dist/marketplace-entry.json. Idempotent; the file is what gets
        # pinned to IPFS so other agents discover this plugin.
        run: node scripts/marketplace-entry.mjs

      - name: Fetch Pinata JWT from GCP Secret Manager
        id: pinata
        # Optional — only runs when PINATA_JWT exists in Secret Manager.
        # First-time releases or org-locked orgs skip this gracefully.
        continue-on-error: true
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5
        with:
          secrets: |-
            pinata_jwt:${{ env.GCP_PROJECT_ID }}/PINATA_JWT

      - name: Pin marketplace entry to IPFS via Pinata
        if: steps.pinata.outcome == 'success'
        env:
          PINATA_JWT: ${{ steps.pinata.outputs.pinata_jwt }}
        # Single-file pin. The returned IpfsHash is the CID we'd reference
        # in the discovery registry update step (which lives outside this
        # repo). Failure here is non-fatal: the publish has already
        # succeeded, the marketplace listing is a downstream concern.
        continue-on-error: true
        run: |
          set -euo pipefail
          cid=$(curl -sf -X POST \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "file=@dist/marketplace-entry.json" \
            "https://api.pinata.cloud/pinning/pinFileToIPFS" \
            | sed -n 's/.*"IpfsHash":"\([^"]*\)".*/\1/p')
          if [ -n "$cid" ]; then
            echo "::notice title=Marketplace pinned::CID=$cid"
            echo "marketplace_cid=$cid" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pinata pin returned no CID; check logs"
          fi
