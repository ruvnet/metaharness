[package]
name = "ruflo-kernel-wasm"
version.workspace = true
publish = false  # napi/wasm binding crate — built into @metaharness/kernel (npm), never published to crates.io (GH cargo-deny: lets allow-wildcard-paths cover the internal ruflo-kernel path dep)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WebAssembly bindings for ruflo-kernel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ruflo-kernel = { path = "../kernel" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
js-sys.workspace = true

[package.metadata.wasm-pack.profile.release]
# --enable-nontrapping-float-to-int + --enable-sign-ext: rustc's wasm32
# target emits these by default (e.g. `f as i64` compiles to
# i64.trunc_sat_f64_s, used by the canonical-JSON integral-float rendering
# in ruflo-kernel::session); wasm-opt validates input against its enabled
# feature set, so they must be switched on explicitly. Both are
# long-standardized and supported by every Node version this package targets.
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
]
